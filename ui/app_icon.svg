<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- background -->
    <rect width="140" height="140" fill="url(#bg)"/>

    <!-- ground shadow -->
    <ellipse cx="70" cy="118" rx="40" ry="9" fill="black" opacity="0.18"/>

    <!-- dashed route the fleet follows -->
    <path d="M22 106 C38 88 44 72 38 56 C32 40 44 26 66 21"
          fill="none" stroke="white" stroke-opacity="0.32" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 9"/>
    <path d="M74 21 C98 26 110 40 106 60 C102 82 114 96 126 102"
          fill="none" stroke="white" stroke-opacity="0.32" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 9"/>

    <!-- AGV, top-down view -->
    <g transform="translate(70 70)">
        <!-- wheels, peeking out from under the chassis -->
        <rect x="-36" y="-15" width="12" height="19" rx="4" fill="black" opacity="0.25"/>
        <rect x="24" y="-15" width="12" height="19" rx="4" fill="black" opacity="0.25"/>
        <rect x="-36" y="4" width="12" height="19" rx="4" fill="black" opacity="0.25"/>
        <rect x="24" y="4" width="12" height="19" rx="4" fill="black" opacity="0.25"/>

        <!-- chassis -->
        <rect x="-27" y="-26" width="54" height="52" rx="14" fill="url(#fg)" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>

        <!-- chassis top sheen -->
        <path d="M-26 -20 C-14 -26 14 -26 26 -20 C18 -16 -18 -16 -26 -20Z" fill="white" opacity="0.25"/>

        <!-- forward sensor pucks -->
        <circle cx="-14" cy="-16" r="5" fill="#6532C7" opacity="0.8"/>
        <circle cx="14" cy="-16" r="5" fill="#6532C7" opacity="0.8"/>

        <!-- load platform -->
        <rect x="-18" y="0" width="36" height="18" rx="4" fill="white" opacity="0.35"/>
        <rect x="-18" y="0" width="36" height="18" rx="4" fill="none" stroke="white" stroke-opacity="0.5" stroke-width="1.5"/>

        <!-- heading chevron -->
        <path d="M0 -34 L8 -24 L-8 -24Z" fill="white" opacity="0.85"/>

        <!-- status light -->
        <circle cx="0" cy="9" r="3.5" fill="#22D3EE"/>
    </g>

    <defs>
        <linearGradient id="bg" x1="70" y1="-60" x2="70" y2="160" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6532C7"/>
            <stop offset="1" stop-color="#603B99"/>
        </linearGradient>

        <linearGradient id="fg" x1="40" y1="44" x2="100" y2="122" gradientUnits="userSpaceOnUse">
            <stop stop-color="white"/>
            <stop offset="1" stop-color="#D8F9FD"/>
            <stop offset="1.0001" stop-color="#B8ECFF"/>
        </linearGradient>
    </defs>
</svg>
