<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>VDA5050 Sim</title>
  <style>
    :root {
      --bg-default: #020617;
      --bg-paper: #11131f;
      --bg-paper-2: #171927;
      --primary: #8E56FC;
      --accent: #22d3ee;
      --text: #ffffff;
      --text-2: rgba(255, 255, 255, 0.7);
      --text-3: rgba(255, 255, 255, 0.4);
      --border: rgba(255, 255, 255, 0.1);
      --header-h: 56px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg-default); color: var(--text); }
    body { display: flex; flex-direction: column; }

    /* Header (design-language mandatory top row) */
    header {
      height: var(--header-h); flex: 0 0 var(--header-h);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo { width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #8E56FC 0%, #22D3EE 100%); }
    .title { font-size: 16px; font-weight: 600; }
    .spacer { flex: 1; }
    .home-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 8px;
      border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; }
    .home-btn span { width: 6px; height: 6px; border-radius: 2px; background: var(--text-2); }

    .body { flex: 1; display: flex; min-height: 0; }

    .fleet { width: 280px; flex: 0 0 280px; border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px; }
    .fleet h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-3); margin: 4px 0 10px; }
    .robot-row { padding: 8px 10px; border-radius: 8px; background: var(--bg-paper-2);
      margin-bottom: 8px; font-size: 12px; }
    .robot-row .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); display: inline-block; }
    .dot.on { background: var(--accent); }
    .robot-row .sub { color: var(--text-2); margin-top: 2px; }

    .logs { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .logs h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--text-3); margin: 12px 16px 8px; }
    #log-pane { flex: 1; overflow-y: auto; margin: 0 16px 16px; padding: 12px;
      background: var(--bg-paper); border: 1px solid var(--border); border-radius: 10px;
      font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
    .log-line { color: var(--text-2); }
    .log-line b { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div class="title">VDA5050 Sim</div>
    <div class="spacer"></div>
    <button class="home-btn" title="Home" onclick="location.href='/'"><span></span><span></span><span></span><span></span></button>
  </header>

  <div class="body">
    <div class="fleet">
      <h2>Fleet</h2>
      <div id="fleet-list"></div>
    </div>
    <div class="logs">
      <h2>Logs</h2>
      <div id="log-pane"></div>
    </div>
  </div>

  <script>
    async function refreshFleet() {
      try {
        const res = await fetch('fleet');
        const robots = await res.json();
        document.getElementById('fleet-list').innerHTML = robots.map(r => `
          <div class="robot-row">
            <div class="name"><span class="dot ${r.online ? 'on' : ''}"></span>${r.id}</div>
            <div class="sub">${r.manufacturer} / ${r.model}</div>
            <div class="sub">order: ${r.orderId || '—'} · ${r.driving ? 'driving' : (r.idle ? 'idle' : 'busy')}${r.paused ? ' · paused' : ''}</div>
          </div>
        `).join('');
      } catch (e) { /* transient — next poll will retry */ }
    }

    let lastLen = 0;
    async function refreshLogs() {
      try {
        const res = await fetch('logs?n=300');
        const entries = await res.json();
        if (entries.length === lastLen) return;
        lastLen = entries.length;
        const pane = document.getElementById('log-pane');
        const atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 20;
        pane.innerHTML = entries.map(e => {
          const t = new Date(e.ts * 1000).toISOString().split('T')[1].replace('Z', '');
          return `<div class="log-line">${t} <b>${e.robot_id}</b> ${e.message}</div>`;
        }).join('');
        if (atBottom) pane.scrollTop = pane.scrollHeight;
      } catch (e) { /* transient — next poll will retry */ }
    }

    refreshFleet(); refreshLogs();
    setInterval(refreshFleet, 3000);
    setInterval(refreshLogs, 1500);
  </script>
</body>
</html>
