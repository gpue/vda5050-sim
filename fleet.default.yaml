# Default fleet: 5 real robot archetypes from this repo's own ROBOT_SPECS
# registry (src/vda5050_sim/robot_specs.py) — manufacturer and physical
# parameters come from each manufacturer's public datasheet, not invented
# fictional robots — deliberately multi-vendor, since that's the whole
# reason VDA5050 exists.
#
# Override with FLEET_CONFIG_PATH=/path/to/custom.yaml to run a different
# roster; robot count and features are entirely config-driven. `manufacturer`
# is optional — it defaults to the ROBOT_SPECS entry for `model` if omitted.

robots:
  - id: spot-01
    model: spot
    manufacturer: BostonDynamics # quadruped carrier, 14kg payload
    supported_actions: [pick, drop]

  - id: go2-01
    model: go2
    manufacturer: Unitree # fast patrol quadruped, no cargo actions
    supported_actions: []

  - id: tiago-01
    model: tiago
    manufacturer: PALRobotics # mobile manipulator
    supported_actions: [pick, place, lift]

  - id: h1-01
    model: h1
    manufacturer: Unitree # humanoid, gesture-style instant actions
    supported_actions: [wave]

  - id: pidog-01
    model: pidog
    manufacturer: SunFounder # cheap/slow hobby robot, deliberately flaky
    supported_actions: [bark]
    fault_profile:
      connection_drop_probability: 0.03
      error_injection_probability: 0.05
