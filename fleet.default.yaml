# Default fleet: 5 real robot archetypes from this repo's own ROBOT_SPECS
# registry (src/vda5050_sim/robot_specs.py) — manufacturer and physical
# parameters come from each manufacturer's public datasheet, not invented
# fictional robots — deliberately multi-vendor, since that's the whole
# reason VDA5050 exists.
#
# Override with FLEET_CONFIG_PATH=/path/to/custom.yaml to run a different
# roster; robot count and features are entirely config-driven. `manufacturer`
# is optional — it defaults to the ROBOT_SPECS entry for `model` if omitted.
#
# Full per-robot schema (all fields besides id/model are optional):
#   id: str
#   model: str                              # key into ROBOT_SPECS
#   manufacturer: str                       # defaults from ROBOT_SPECS[model]
#   supported_actions: [str, ...]           # generic instant actions this robot accepts
#   max_speed: float                        # m/s; defaults from ROBOT_SPECS[model].maximumSpeed
#   angular_speed: float                    # rad/s; defaults from ROBOT_SPECS[model].maximumAngularSpeed
#   initial_battery: float                  # percent, default 100.0
#   battery_drain_percent_per_meter: float  # default from DEFAULT_BATTERY_DRAIN_PERCENT_PER_METER
#   battery_charge_percent_per_s: float     # default from DEFAULT_BATTERY_CHARGE_PERCENT_PER_S
#   initial_x/initial_y/initial_theta: float  # home/dock pose, default 0.0 — every robot otherwise
#                                              # starts stacked at the map origin
#   protocol_version: str                   # VDA5050 header `version` this robot announces, default "3.0.0".
#                                            # "1.x"/"2.x" values publish on their own NATS subject
#                                            # (vda5050.v1/v2.*) and MQTT topic (vda5050/v1/v2/*) with the
#                                            # pre-3.0 wire shape (agvPosition/batteryState/safetyState.eStop)
#                                            # and reject 3.0.0-only instant actions (zones, updateCertificate,
#                                            # trigger) — see legacy_shapes.py / agv.py's LEGACY_UNSUPPORTED_ACTIONS.
#   fault_profile:
#     connection_drop_probability: float    # per connection-heartbeat tick
#     error_injection_probability: float    # per real tick — generic hardwareFault, or marks a RUNNING retriable action RETRIABLE
#                                            # (fleet control must send retry/skipRetry — see spec Table 4)
#     field_violation_probability: float    # per real tick — halts movement for a few seconds, then auto-clears
#     service_mode_probability: float       # per real tick — suspends order execution (operatingMode=SERVICE), then auto-recovers
#     emergency_stop_probability: float     # per real tick — sets safetyState.activeEmergencyStop (MANUAL/REMOTE), then auto-clears

robots:
  - id: spot-01
    model: spot
    manufacturer: BostonDynamics # quadruped carrier, 14kg payload
    supported_actions: [pick, drop]
    initial_x: 0.0
    initial_y: 0.0

  - id: go2-01
    model: go2
    manufacturer: Unitree # fast patrol quadruped, no cargo actions
    supported_actions: []
    initial_x: 5.0
    initial_y: 0.0

  - id: tiago-01
    model: tiago
    manufacturer: PALRobotics # mobile manipulator
    supported_actions: [pick, place, lift]
    initial_x: 10.0
    initial_y: 0.0

  - id: h1-01
    model: h1
    manufacturer: Unitree # humanoid, gesture-style instant actions
    supported_actions: [wave]
    initial_x: 0.0
    initial_y: 5.0

  - id: pidog-01
    model: pidog
    manufacturer: SunFounder # cheap/slow hobby robot, deliberately flaky
    supported_actions: [bark]
    initial_x: 5.0
    initial_y: 5.0
    fault_profile:
      connection_drop_probability: 0.03
      error_injection_probability: 0.05

  # Older-firmware robots — same simulation engine underneath, but publish
  # pre-3.0 wire shapes and reject 3.0.0-only capabilities (see
  # protocol_version doc above). Exist to exercise nova-nav's handling of a
  # mixed-version fleet on the same broker.
  - id: go2-legacy
    model: go2
    manufacturer: Unitree
    supported_actions: []
    initial_x: 10.0
    initial_y: 5.0
    protocol_version: "2.1.0"

  - id: pidog-legacy
    model: pidog
    manufacturer: SunFounder
    supported_actions: [bark]
    initial_x: 15.0
    initial_y: 5.0
    protocol_version: "1.1.0"
