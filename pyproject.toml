[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vda5050_sim"]

[project]
name = "vda5050-sim"
version = "0.1.0"
description = "Standards-compliant VDA5050 robot fleet simulator."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "nats-py>=2.10,<3",
    # Standalone mode: speak plain VDA5050-over-MQTT to any real broker/fleet
    # manager, no NATS required.
    "aiomqtt>=2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6,<7",
    # Validates emitted messages against the vendored official VDA5050 JSON
    # Schemas (src/vda5050_sim/json_schemas/).
    "jsonschema>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
