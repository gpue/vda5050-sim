[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vda5050_sim"]

[project]
name = "vda5050-sim"
version = "0.1.0"
description = "Standards-compliant VDA5050 robot fleet simulator, packaged as a Nova app."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # VDA5050 v3.0.0 schemas, error helpers, topic mapping, and robot-spec
    # factsheet builder — public repo, reused instead of hand-rolling the
    # wire contract (keeps us byte-compatible with nova-nav's dashboard).
    "nova-vda5050",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "nats-py>=2.10,<3",
    # Standalone/non-Nova mode: speak plain VDA5050-over-MQTT to any real
    # broker/fleet manager, no NATS or Nova platform required.
    "aiomqtt>=2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

# Public repo, no git tag pinned upstream yet — pin to a commit once nova-vda5050
# cuts a release. No credentials needed: this is a public wandelbotsgmbh repo.
[tool.uv.sources]
nova-vda5050 = { git = "https://github.com/wandelbotsgmbh/nova-vda5050.git" }

[tool.ruff]
target-version = "py311"
line-length = 135

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
